<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MonoTools</title>
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        var basePath = location.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');
        var redirectPath = '/'
          + location.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/');

        var redirect = basePath + '/?p=' + encodeURIComponent(redirectPath + location.search + location.hash);
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
